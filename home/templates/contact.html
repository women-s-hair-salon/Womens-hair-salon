{% extends 'base/base.html' %}
{% load static %}

{% block title %}تماس با ما{% endblock %}

{% block main %}
<section class="max-w-2xl mx-auto px-4 py-16">
  <div class="bg-white dark:bg-gray-900 shadow-xl rounded-2xl border border-gray-200 dark:border-gray-700 p-8 space-y-6">
    <h2 class="text-3xl font-extrabold text-center text-pink-600 dark:text-pink-400">تماس با ما</h2>

    <form method="post" novalidate class="space-y-6">
      {% csrf_token %}

      <div>
        <label for="id_full_name" class="block mb-1 text-sm font-semibold text-gray-700 dark:text-gray-200">نام کامل</label>
        <input type="text" name="full_name" id="id_full_name" value="{{ form.full_name.value|default_if_none:'' }}"
          class="form-input w-full border border-gray-300 dark:border-gray-600 rounded-md px-4 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-pink-500 focus:border-pink-500">
      </div>

      <div>
        <label for="id_email" class="block mb-1 text-sm font-semibold text-gray-700 dark:text-gray-200">ایمیل</label>
        <input type="email" name="email" id="id_email" value="{{ form.email.value|default_if_none:'' }}"
          class="form-input w-full border border-gray-300 dark:border-gray-600 rounded-md px-4 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-pink-500 focus:border-pink-500">
      </div>

      <div>
        <label for="id_phone" class="block mb-1 text-sm font-semibold text-gray-700 dark:text-gray-200">شماره موبایل</label>
        <input type="text" name="phone" id="id_phone" value="{{ form.phone.value|default_if_none:'' }}"
          placeholder="مثلاً 09123456789"
          class="form-input w-full border border-gray-300 dark:border-gray-600 rounded-md px-4 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-pink-500 focus:border-pink-500">
      </div>

      <div>
        <label for="id_message" class="block mb-1 text-sm font-semibold text-gray-700 dark:text-gray-200">پیام</label>
        <textarea name="message" id="id_message" rows="5"
          class="form-textarea w-full border border-gray-300 dark:border-gray-600 rounded-md px-4 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-pink-500 focus:border-pink-500">{{ form.message.value|default_if_none:'' }}</textarea>
      </div>

      <div class="text-center">
        <button type="submit"
          class="w-full sm:w-auto px-6 py-3 rounded-xl bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold hover:from-purple-600 hover:to-pink-600 transition">
          ارسال پیام
        </button>
      </div>
    </form>
  </div>
</section>



<script>
  lucide.createIcons();
</script>
{% endblock %}
