# 80: فقط ACME و ریدایرکت به https
server {
    listen 80;
    server_name sindokhtacademy.ir www.sindokhtacademy.ir;

    # مسیر چالش ACME
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443: سایت اصلی با SSL
server {
    listen 443 ssl http2;
    server_name sindokhtacademy.ir www.sindokhtacademy.ir;

    ssl_certificate     /etc/letsencrypt/live/sindokhtacademy.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sindokhtacademy.ir/privkey.pem;

    # امنیت پایه SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    # استاتیک‌ها
    location /static/ {
        alias /var/www/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # مدیا
    location /media/ {
        alias /var/www/media/;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
    }

    # proxy به وب‌اپ (gunicorn)
    location / {
        proxy_pass         http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_read_timeout  60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout  60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml application/xml+rss
               text/javascript image/svg+xml;
    gzip_min_length 1024;
}
