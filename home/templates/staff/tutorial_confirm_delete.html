{% extends 'base/base.html' %}
{% block title %}حذف آموزش{% endblock %}
{% block main %}
<div class="max-w-xl mx-auto p-4 space-y-4">
  <h1 class="text-xl font-extrabold">حذف «{{ object.title }}»؟</h1>
  <div class="card p-5">
    <p class="text-sm text-gray-600 dark:text-gray-300">این کار همه سرفصل‌های مرتبط را هم حذف می‌کند.</p>
    <form method="post" class="mt-4 flex gap-2">
      {% csrf_token %}
      <a href="{% url 'staff_tutorials' %}" class="btn btn-outline">بازگشت</a>
      <button class="btn btn-primary !bg-red-600 hover:!bg-red-700">تأیید حذف</button>
    </form>
  </div>
</div>
{% endblock %}
