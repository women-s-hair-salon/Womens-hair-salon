{% extends 'base/base.html' %}
{% block title %}خدمات هر بخش{{ category.title }}{% endblock %}
{% block main %}
<section class="max-w-5xl mx-auto py-16 px-4">
  <div class="text-center mb-12">
    <h1 class="text-4xl font-bold text-pink-600 dark:text-pink-400">{{ category.title }}</h1>
    <p class="mt-4 text-gray-600 dark:text-gray-300">{{ category.description }}</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-10">
    {% for service in services %}
    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden shadow-md">
      <img src="{{ service.image.url }}" alt="{{ service.name }}" class="w-full h-56 object-cover">
      <div class="p-6">
        <h3 class="text-2xl font-bold text-pink-600 dark:text-pink-400 mb-2">{{ service.name }}</h3>
        <p class="text-gray-700 dark:text-gray-300">{{ service.description }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
