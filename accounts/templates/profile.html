{% extends 'base/base.html' %}
{% load static %}
{% load custom_filters %}

{% block title %}پروفایل من{% endblock %}

{% block main %}
<div class="min-h-screen bg-gradient-to-br from-purple-50 dark:from-gray-900 to-pink-100 dark:to-gray-800 py-20 px-4 sm:px-6 lg:px-8">
  <div class="max-w-2xl mx-auto bg-white dark:bg-gray-900 shadow-2xl rounded-2xl p-10 space-y-10 border border-gray-200 dark:border-gray-700">
    <h2 class="text-4xl font-bold text-center text-pink-600 dark:text-pink-400 tracking-tight">ویرایش پروفایل</h2>

    <form id="profile-form" method="post" class="space-y-6">
      {% csrf_token %}

      <!-- نام -->
      <div>
        <label for="first_name" class="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-1">نام</label>
        <input type="text" name="first_name" id="first_name"
               value="{{ form.first_name.value|default_if_none:'' }}"
               class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 rounded-md px-4 py-2 focus:ring-pink-500 focus:border-pink-500 transition duration-150 ease-in-out" />
      </div>

      <!-- نام خانوادگی -->
      <div>
        <label for="last_name" class="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-1">نام خانوادگی</label>
        <input type="text" name="last_name" id="last_name"
               value="{{ form.last_name.value|default_if_none:'' }}"
               class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 rounded-md px-4 py-2 focus:ring-pink-500 focus:border-pink-500 transition duration-150 ease-in-out" />
      </div>

      <!-- تاریخ تولد با آیکون -->
      <div x-data="{ open: false }" class="relative bg-pink-50 dark:bg-gray-800 border border-pink-200 dark:border-gray-700 rounded-lg p-6 shadow-inner space-y-4">
        <button type="button" @click="open = !open"
                class="w-full flex items-center justify-between px-4 py-2 bg-white dark:bg-gray-900 rounded-md shadow border border-gray-300 dark:border-gray-600 focus:outline-none">
          <span class="text-gray-700 dark:text-gray-200 font-medium">انتخاب تاریخ تولد</span>
          <i x-bind:class="{'rotate-180': open}" data-lucide="calendar"
             class="w-5 h-5 text-pink-500 transform transition-transform duration-300"></i>
        </button>

        <div x-show="open" x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 -translate-y-2"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 -translate-y-2"
             class="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-4">

          <!-- سال -->
          <div>
            <label for="year" class="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-1">سال</label>
            <select id="year" name="year"
                    class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 rounded-md px-3 py-2 focus:ring-pink-500 focus:border-pink-500">
              <option disabled selected>سال</option>
              {% for y in 1300|to:1403 %}
                <option value="{{ y }}" {% if birth_year == y %}selected{% endif %}>{{ y }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- ماه -->
          <div>
            <label for="month" class="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-1">ماه</label>
            <select id="month" name="month"
                    class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 rounded-md px-3 py-2 focus:ring-pink-500 focus:border-pink-500">
              <option disabled selected>ماه</option>
              {% for idx, name in months %}
                <option value="{{ idx }}" {% if birth_month == idx %}selected{% endif %}>{{ name }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- روز -->
          <div>
            <label for="day" class="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-1">روز</label>
            <select id="day" name="day"
                    class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 rounded-md px-3 py-2 focus:ring-pink-500 focus:border-pink-500">
              <option disabled selected>روز</option>
              {% for d in 1|to:32 %}
                <option value="{{ d }}" {% if birth_day == d %}selected{% endif %}>{{ d }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>

      <!-- دکمه ذخیره -->
      <div>
        <button type="submit"
                class="w-full flex justify-center py-3 px-6 border border-transparent text-sm font-bold rounded-md text-white bg-gradient-to-r from-pink-500 to-purple-500 hover:from-purple-600 hover:to-pink-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-400 transition duration-200">
          ذخیره تغییرات
        </button>
      </div>
    </form>
  <div id="message-box" class="mt-4 text-sm font-semibold"></div>
  </div>
</div>

<script>
  lucide.createIcons();
</script>


    <script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.getElementById("profile-form");
  const messageBox = document.getElementById("message-box");

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    const formData = new FormData(form);
    const csrfToken = form.querySelector("[name=csrfmiddlewaretoken]").value;

    fetch("{% url 'profile' %}", {
      method: "POST",
      headers: {
        "X-CSRFToken": csrfToken,
      },
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      messageBox.innerText = data.message;
      messageBox.classList.remove("hidden");
      messageBox.classList.remove("text-red-600", "dark:text-red-400");
      messageBox.classList.remove("text-green-600", "dark:text-green-400");

      if (data.success) {
        messageBox.classList.add("text-green-600", "dark:text-green-400");
      } else {
        messageBox.classList.add("text-red-600", "dark:text-red-400");
      }
    })
    .catch(err => {
      messageBox.innerText = "خطا در ذخیره‌سازی اطلاعات.";
      messageBox.classList.remove("hidden");
      messageBox.classList.remove("text-green-600", "dark:text-green-400");
      messageBox.classList.add("text-red-600", "dark:text-red-400");
    });
  });
});
</script>

{% endblock %}
