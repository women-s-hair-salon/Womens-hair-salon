{% extends 'base/base.html' %}
{% block title %}حذف پیام{% endblock %}
{% block main %}
<section class="max-w-md mx-auto p-4">
  <div class="card p-5 md:p-6 text-center space-y-4">
    <h1 class="text-xl font-extrabold">حذف پیام</h1>
    <p class="text-sm text-gray-600 dark:text-gray-300">آیا از حذف این پیام مطمئن هستید؟</p>
    <form method="post">
      {% csrf_token %}
      <div class="flex justify-center gap-2">
        <a href="{% url 'staff_messages' %}" class="btn btn-outline">انصراف</a>
        <button class="btn !bg-red-600 hover:!bg-red-700 text-white">حذف</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
