services:
  db:
    image: postgres:16-alpine
    container_name: salon_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tehran
    volumes:
      - pg_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salon_web
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    command: ["/app/entrypoint.sh"]
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: salon_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"           # الان 443 را هم باز می‌کنیم
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    container_name: salon_certbot
    depends_on:
      - nginx
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  scheduler:
    build:
      context: .
    container_name: salon_scheduler
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo '0 2 * * * cd /app && python manage.py purge_old_slots >> /var/log/cron.log 2>&1' > /etc/crontabs/root
       && touch /var/log/cron.log
       && crond -f -l 8"

volumes:
  pg_data:
  static_volume:
  media_volume:
  certbot_certs:
  certbot_www:





